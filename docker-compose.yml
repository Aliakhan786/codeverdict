# One command runs everything:   docker compose up --build
#   Frontend  -> http://localhost:3001
#   API docs  -> http://localhost:3001/swagger-ui.html
# For development run only the database:   docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeverdict
      POSTGRES_USER: codeverdict
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codeverdict}
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeverdict -d codeverdict"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/codeverdict
      DB_USER: codeverdict
      DB_PASSWORD: ${DB_PASSWORD:-codeverdict}
      CORS_ORIGINS: http://localhost:3001
      # "local" = code runs inside this backend container (isolated from your machine).
      # For a public server use docker-compose.sandbox.yml (one throw-away container per run).
      RUNNER_MODE: local
    ports:
      - "18081:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  pgdata:
